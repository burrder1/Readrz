<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KOKORO SERVER TEST</title>

<style>
    body {
        background: #172218;
        color: #dce9a8;
        font-family: monospace;
        padding: 30px;
        margin: 0;
    }

    .box {
        max-width: 700px;
        margin: auto;
        border: 4px solid #9aaa62;
        padding: 30px;
        background: #172218;
    }

    h1 {
        font-size: 40px;
        margin-top: 0;
    }

    textarea,
    select,
    button {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 18px;
        padding: 18px;
        margin-top: 15px;
    }

    textarea,
    select {
        background: #111;
        color: #dce9a8;
        border: 3px solid #9aaa62;
    }

    button {
        background: #111;
        color: #dce9a8;
        border: 3px solid #9aaa62;
        cursor: pointer;
        font-weight: bold;
    }

    button:active {
        transform: translateY(1px);
    }

    #status {
        margin-top: 25px;
        font-size: 18px;
        white-space: pre-wrap;
    }

    #error {
        margin-top: 20px;
        color: #ff8f8f;
        white-space: pre-wrap;
    }

    #audioBox {
        margin-top: 25px;
    }

    audio {
        width: 100%;
    }

    pre {
        background: #111;
        border: 2px solid #555;
        padding: 15px;
        overflow-x: auto;
        white-space: pre-wrap;
        color: #aaa;
    }
</style>
</head>

<body>

<div class="box">

    <h1>KOKORO SERVER TEST</h1>

    <p>SERVER-SIDE NEURAL VOICE</p>

    <textarea id="text" rows="5">The ancient door slowly opens. Somewhere beyond it, a forgotten kingdom waits in the darkness.</textarea>

    <select id="voice">
        <option value="af_heart">Heart — American Female</option>
        <option value="af_bella">Bella — American Female</option>
        <option value="af_nicole">Nicole — American Female</option>
        <option value="af_sarah">Sarah — American Female</option>
        <option value="af_nova">Nova — American Female</option>
        <option value="am_michael">Michael — American Male</option>
        <option value="am_fenrir">Fenrir — American Male</option>
        <option value="am_puck">Puck — American Male</option>
    </select>

    <button id="speak">▶ SPEAK</button>

    <div id="status">
        STATUS: READY
    </div>

    <div id="error"></div>

    <div id="audioBox"></div>

    <details style="margin-top:25px;">
        <summary>DEBUG RESPONSE</summary>
        <pre id="debug"></pre>
    </details>

</div>

<script>

const SPACE_URL =
    "https://YOUR-DUPLICATED-KOKORO-SPACE.hf.space";

const status = document.getElementById("status");
const error = document.getElementById("error");
const debug = document.getElementById("debug");
const audioBox = document.getElementById("audioBox");

document.getElementById("speak").addEventListener("click", async () => {

    error.textContent = "";
    debug.textContent = "";
    audioBox.innerHTML = "";

    const text = document.getElementById("text").value.trim();
    const voice = document.getElementById("voice").value;

    if (!text) {
        error.textContent = "ERROR: No text entered.";
        return;
    }

    try {

        status.textContent = "STATUS: CONNECTING...";

        /*
         * STEP 1
         * Submit the generation request.
         *
         * Kokoro generate_first expects:
         * text
         * voice
         * speed
         * use_gpu
         */

        const submitResponse = await fetch(
            SPACE_URL +
            "/gradio_api/call/generate_first",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    data: [
                        text,
                        voice,
                        1,
                        false
                    ]
                })
            }
        );

        const submitText = await submitResponse.text();

        debug.textContent +=
            "SUBMIT RESPONSE:\n" +
            submitText +
            "\n\n";

        if (!submitResponse.ok) {
            throw new Error(
                "Submit failed: HTTP " +
                submitResponse.status +
                "\n\n" +
                submitText
            );
        }

        let submitData;

        try {
            submitData = JSON.parse(submitText);
        } catch {
            throw new Error(
                "Server did not return JSON:\n\n" +
                submitText
            );
        }

        if (!submitData.event_id) {
            throw new Error(
                "No event_id returned by server.\n\n" +
                submitText
            );
        }

        const eventId = submitData.event_id;

        status.textContent =
            "STATUS: GENERATING VOICE...\n" +
            "EVENT: " +
            eventId;

        /*
         * STEP 2
         * Listen for the completed Gradio event.
         */

        const eventResponse = await fetch(
            SPACE_URL +
            "/gradio_api/call/generate_first/" +
            eventId
        );

        if (!eventResponse.ok) {
            const eventError = await eventResponse.text();

            throw new Error(
                "Event request failed: HTTP " +
                eventResponse.status +
                "\n\n" +
                eventError
            );
        }

        const eventText = await eventResponse.text();

        debug.textContent +=
            "EVENT RESPONSE:\n" +
            eventText +
            "\n\n";

        /*
         * Gradio returns Server-Sent Events.
         * Find the "complete" event.
         */

        const lines = eventText.split("\n");

        let completeData = null;

        for (let i = 0; i < lines.length; i++) {

            if (lines[i].trim() === "event: complete") {

                for (
                    let j = i + 1;
                    j < lines.length;
                    j++
                ) {

                    if (
                        lines[j].startsWith("data:")
                    ) {

                        const raw =
                            lines[j]
                            .substring(5)
                            .trim();

                        try {
                            completeData =
                                JSON.parse(raw);
                        } catch {
                            completeData = raw;
                        }

                        break;
                    }
                }
            }
        }

        if (!completeData) {

            throw new Error(
                "The server never returned a complete audio event.\n\n" +
                eventText
            );
        }

        debug.textContent +=
            "PARSED RESULT:\n" +
            JSON.stringify(
                completeData,
                null,
                2
            );

        /*
         * The audio output is the first output.
         */

        let audioResult =
            Array.isArray(completeData)
                ? completeData[0]
                : completeData;

        /*
         * Gradio may return the audio as:
         *
         * a URL string
         * an object containing a URL
         * an object containing a path
         */

        let audioUrl = null;

        if (typeof audioResult === "string") {

            audioUrl = audioResult;

        } else if (audioResult && audioResult.url) {

            audioUrl = audioResult.url;

        } else if (audioResult && audioResult.path) {

            audioUrl =
                SPACE_URL +
                "/file=" +
                audioResult.path;
        }

        if (!audioUrl) {

            throw new Error(
                "Generation completed, but no audio URL was found.\n\n" +
                JSON.stringify(
                    completeData,
                    null,
                    2
                )
            );
        }

        /*
         * Convert relative URLs to absolute URLs.
         */

        if (audioUrl.startsWith("/")) {
            audioUrl =
                SPACE_URL +
                audioUrl;
        }

        status.textContent =
            "STATUS: AUDIO READY.";

        /*
         * Create an actual audio player.
         */

        const audio = document.createElement("audio");

        audio.controls = true;
        audio.autoplay = true;
        audio.src = audioUrl;

        audioBox.appendChild(audio);

        /*
         * Try autoplay, but don't fail if the browser blocks it.
         */

        try {
            await audio.play();
        } catch {
            status.textContent =
                "STATUS: AUDIO READY — PRESS PLAY.";
        }

    } catch (err) {

        console.error(err);

        status.textContent =
            "STATUS: GENERATION FAILED.";

        error.textContent =
            err.message || String(err);
    }

});

</script>

</body>
</html>
