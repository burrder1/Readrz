<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kokoro Server Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #202b20;
    color: #d7e6a5;
    font-family: monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.box {
    width: 100%;
    max-width: 600px;
    border: 4px solid #8fa85b;
    padding: 24px;
    box-shadow: 0 0 0 6px #111;
}

h1 {
    margin-top: 0;
    letter-spacing: 3px;
}

textarea,
select,
button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    font: inherit;
}

textarea {
    min-height: 150px;
    background: #111;
    color: #d7e6a5;
    border: 2px solid #8fa85b;
}

select,
button {
    background: #111;
    color: #d7e6a5;
    border: 2px solid #8fa85b;
}

button {
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
}

#status {
    margin-top: 20px;
    line-height: 1.5;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="box">

<h1>KOKORO SERVER TEST</h1>

<p>
SERVER-SIDE NEURAL VOICE
</p>

<textarea id="text">The ancient door slowly opens. Somewhere beyond it, a forgotten kingdom waits in the darkness.</textarea>

<select id="voice">
    <option value="af_heart">Heart — American Female</option>
    <option value="af_bella">Bella — American Female</option>
    <option value="af_sarah">Sarah — American Female</option>
    <option value="am_michael">Michael — American Male</option>
    <option value="am_adam">Adam — American Male</option>
</select>

<button id="connect">
    CONNECT TO KOKORO
</button>

<button id="speak" disabled>
    ▶ SPEAK
</button>

<div id="status">
STATUS: WAITING.
</div>

</div>

<script type="module">

import { Client } from
"https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";


let client = null;
let audioPlayer = null;


const connectButton =
document.getElementById("connect");

const speakButton =
document.getElementById("speak");

const textBox =
document.getElementById("text");

const voiceSelect =
document.getElementById("voice");

const status =
document.getElementById("status");


function setStatus(message) {

    status.textContent =
        "STATUS: " + message;

}


/* =========================================
   CONNECT
========================================= */

connectButton.addEventListener(
    "click",
    async () => {

        connectButton.disabled = true;

        setStatus(
            "CONNECTING TO OFFICIAL KOKORO SERVER..."
        );

        try {

            client =
                await Client.connect(
                    "hexgrad/Kokoro-TTS",
                    {
                        status_callback:
                            (info) => {

                                console.log(
                                    "SPACE STATUS:",
                                    info
                                );

                            }
                    }
                );


            console.log(
                "KOKORO CLIENT:",
                client
            );


            setStatus(
                "CONNECTED. CHECKING API..."
            );


            const api =
                await client.view_api();


            console.log(
                "KOKORO API:",
                api
            );


            setStatus(
                "CONNECTED. READY TO SPEAK."
            );


            speakButton.disabled =
                false;


            connectButton.textContent =
                "CONNECTED";


        }

        catch (error) {

            console.error(
                "CONNECTION ERROR:",
                error
            );


            setStatus(
                "CONNECTION FAILED.\n\n" +
                error.message
            );


            connectButton.disabled =
                false;

        }

    }
);


/* =========================================
   SPEAK
========================================= */

speakButton.addEventListener(
    "click",
    async () => {

        if (!client) {

            setStatus(
                "CONNECT FIRST."
            );

            return;
        }


        const text =
            textBox.value.trim();


        if (!text) {

            setStatus(
                "ENTER SOME TEXT."
            );

            return;
        }


        speakButton.disabled =
            true;


        setStatus(
            "SENDING TEXT TO KOKORO..."
        );


        try {

            const voice =
                voiceSelect.value;


            /*
             * Ask the Space what its actual API
             * currently looks like.
             */

            const api =
                await client.view_api();


            console.log(
                "CURRENT API:",
                api
            );


            /*
             * Try the official generate endpoint.
             *
             * The payload is intentionally kept
             * separate so we can see exactly what
             * the Space accepts.
             */

            const result =
                await client.predict(
                    "/generate",
                    {
                        text: text,
                        voice: voice,
                        speed: 1
                    }
                );


            console.log(
                "KOKORO RESULT:",
                result
            );


            const data =
                result.data;


            if (!data || !data.length) {

                throw new Error(
                    "KOKORO RETURNED NO AUDIO."
                );

            }


            console.log(
                "AUDIO DATA:",
                data
            );


            let audioURL = null;


            const first =
                data[0];


            if (
                typeof first ===
                "string"
            ) {

                audioURL =
                    first;

            }

            else if (
                first &&
                first.url
            ) {

                audioURL =
                    first.url;

            }

            else if (
                first &&
                first.path
            ) {

                audioURL =
                    first.path;

            }


            if (!audioURL) {

                throw new Error(
                    "AUDIO WAS RETURNED IN AN UNKNOWN FORMAT.\n\n" +
                    JSON.stringify(
                        first,
                        null,
                        2
                    )
                );

            }


            setStatus(
                "AUDIO RECEIVED. PLAYING..."
            );


            if (audioPlayer) {

                audioPlayer.pause();

                audioPlayer = null;

            }


            audioPlayer =
                new Audio(audioURL);


            audioPlayer.onended =
                () => {

                    setStatus(
                        "COMPLETE."
                    );

                    speakButton.disabled =
                        false;

                };


            audioPlayer.onerror =
                (error) => {

                    console.error(
                        "AUDIO ERROR:",
                        error
                    );

                    setStatus(
                        "AUDIO PLAYBACK FAILED."
                    );

                    speakButton.disabled =
                        false;

                };


            await audioPlayer.play();

        }

        catch (error) {

            console.error(
                "KOKORO GENERATION ERROR:",
                error
            );


            setStatus(
                "GENERATION FAILED.\n\n" +
                error.message
            );


            speakButton.disabled =
                false;

        }

    }
);

</script>

</body>
</html>
