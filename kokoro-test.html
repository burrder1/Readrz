<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOKORO TEST V2</title>
<style>
body {
  background:#172218;
  color:#dce9a8;
  font-family:monospace;
  padding:30px;
}
h1 {
  font-size:40px;
}
button {
  padding:20px;
  width:100%;
  font:inherit;
  background:#111;
  color:#dce9a8;
  border:3px solid #9aaa62;
}
</style>
</head>

<body>

<h1>KOKORO TEST V2</h1>

<p id="status">NEW CODE LOADED.</p>

<button id="test">TEST KOKORO</button>

<script>

document.getElementById("test").onclick = async function() {

  const status = document.getElementById("status");

  status.textContent = "CONNECTING...";

  try {

    const response = await fetch(
      "https://hexgrad-kokoro-tts.hf.space/gradio_api/call/generate_first",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          data: [
            "Hello. This is a Kokoro voice test.",
            "af_heart",
            1,
            false
          ]
        })
      }
    );

    status.textContent =
      "SERVER RESPONSE: HTTP " + response.status;

    const data = await response.text();

    console.log(data);

  } catch(error) {

    status.textContent =
      "ERROR: " + error.message;

    console.error(error);

  }

};

</script>

</body>
</html>
