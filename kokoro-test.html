<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kokoro Voice Test</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #202b20;
        color: #d7e6a5;
        font-family: monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .box {
        width: 100%;
        max-width: 600px;
        border: 4px solid #8fa85b;
        padding: 24px;
        box-shadow: 0 0 0 6px #111;
    }

    h1 {
        margin-top: 0;
        letter-spacing: 3px;
    }

    textarea,
    select,
    button {
        width: 100%;
        box-sizing: border-box;
        margin-top: 12px;
        padding: 14px;
        font: inherit;
    }

    textarea {
        min-height: 150px;
        background: #111;
        color: #d7e6a5;
        border: 2px solid #8fa85b;
    }

    select,
    button {
        background: #111;
        color: #d7e6a5;
        border: 2px solid #8fa85b;
    }

    button {
        cursor: pointer;
        font-weight: bold;
    }

    button:disabled {
        opacity: 0.5;
    }

    #status {
        margin-top: 20px;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="box">

    <h1>KOKORO VOICE TEST</h1>

    <p>
        LOCAL NEURAL TTS TEST
    </p>

    <textarea id="text">The ancient door slowly opens. Somewhere beyond it, a forgotten kingdom waits in the darkness.</textarea>

    <select id="voice">
        <option value="af_heart">Heart — American Female</option>
        <option value="af_bella">Bella — American Female</option>
        <option value="af_nicole">Nicole — American Female</option>
        <option value="af_sarah">Sarah — American Female</option>
        <option value="am_adam">Adam — American Male</option>
        <option value="am_michael">Michael — American Male</option>
        <option value="bf_emma">Emma — British Female</option>
        <option value="bm_george">George — British Male</option>
    </select>

    <button id="load">
        LOAD KOKORO
    </button>

    <button id="speak" disabled>
        ▶ SPEAK
    </button>

    <div id="status">
        STATUS: WAITING.
    </div>

</div>


<script type="module">

import { KokoroTTS } from
"https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm";


const MODEL =
"onnx-community/Kokoro-82M-v1.0-ONNX";


let tts = null;


const loadButton =
document.getElementById("load");

const speakButton =
document.getElementById("speak");

const textBox =
document.getElementById("text");

const voiceSelect =
document.getElementById("voice");

const status =
document.getElementById("status");


/* =====================================================
   LOAD MODEL
===================================================== */

loadButton.addEventListener(
    "click",
    async () => {

        try {

            loadButton.disabled = true;

            status.textContent =
                "STATUS: LOADING KOKORO... THIS MAY TAKE A WHILE THE FIRST TIME.";

            /*
               WASM is intentionally used for this first test.
               It has the broadest browser compatibility.
            */

            tts =
                await KokoroTTS.from_pretrained(
                    MODEL,
                    {
                        dtype: "q8",
                        device: "wasm"
                    }
                );


            status.textContent =
                "STATUS: KOKORO READY.";

            speakButton.disabled = false;

            loadButton.textContent =
                "KOKORO READY";

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "STATUS: FAILED — CHECK BROWSER CONSOLE.";

            loadButton.disabled = false;
        }

    }
);


/* =====================================================
   SPEAK
===================================================== */

speakButton.addEventListener(
    "click",
    async () => {

        if (!tts) {
            return;
        }


        try {

            speakButton.disabled = true;

            status.textContent =
                "STATUS: GENERATING VOICE...";


            const text =
                textBox.value.trim();


            if (!text) {

                status.textContent =
                    "STATUS: ENTER SOME TEXT.";

                speakButton.disabled = false;

                return;
            }


            const audio =
                await tts.generate(
                    text,
                    {
                        voice:
                            voiceSelect.value
                    }
                );


            const blob =
                audio.toBlob();


            const url =
                URL.createObjectURL(blob);


            const player =
                new Audio(url);


            player.onended =
                () => {

                    URL.revokeObjectURL(url);

                    speakButton.disabled =
                        false;

                    status.textContent =
                        "STATUS: COMPLETE.";
                };


            await player.play();


            status.textContent =
                "STATUS: SPEAKING...";


        }

        catch (error) {

            console.error(error);

            status.textContent =
                "STATUS: AUDIO FAILED — CHECK CONSOLE.";

            speakButton.disabled =
                false;
        }

    }
);

</script>

</body>
</html>
