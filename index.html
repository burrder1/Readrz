<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Reader</title>
<meta name="theme-color" content="#1F2623">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="dash-header">
    <div class="odometer" aria-label="Pages scanned">
      <span id="pageCount">00</span><span class="odometer-slash">/</span><span id="pageTotal">10</span>
    </div>
    <div class="dash-label">PAGES SCANNED</div>
  </header>

  <main>
    <section class="filmstrip-wrap">
      <div id="filmstrip" class="filmstrip">
        <p id="emptyState" class="empty-state">No pages yet. Tap the shutter below to scan your first page.</p>
      </div>
    </section>

    <section class="shutter-wrap">
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      <button id="scanBtn" class="shutter" aria-label="Scan a page">
        <span class="shutter-inner"></span>
      </button>
      <div class="shutter-hint">SCAN PAGE</div>
    </section>

    <section class="panel">
      <div class="panel-row">
        <label for="voiceSelect" class="panel-label">VOICE</label>
        <select id="voiceSelect" class="dash-select"></select>
      </div>
      <div class="panel-row">
        <label for="rateSlider" class="panel-label">SPEED</label>
        <input type="range" id="rateSlider" min="0.75" max="1.5" step="0.05" value="1">
        <span id="rateValue" class="dash-mono">1.00x</span>
      </div>
    </section>

    <section class="transport">
      <button id="prevBtn" class="transport-btn" aria-label="Previous page">⏮</button>
      <button id="playBtn" class="transport-btn transport-btn--main" aria-label="Play">▶</button>
      <button id="nextBtn" class="transport-btn" aria-label="Next page">⏭</button>
      <button id="clearBtn" class="transport-btn transport-btn--ghost" aria-label="Clear all pages">CLEAR</button>
    </section>

    <p id="statusLine" class="status-line">Ready.</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
